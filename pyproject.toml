[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agfc"
version = "0.1.1"
description = "Standalone figure extraction and MinerU artifact repair with stable public contracts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow==11.3.0",
  "PyMuPDF==1.26.5",
]

[project.optional-dependencies]
integrations = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "jsonschema>=4,<5", "ruff==0.15.6"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[project.scripts]
agfc = "agfc.runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agfc = ["schemas/*.json"]
