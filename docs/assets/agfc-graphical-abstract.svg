<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">AGFC graphical abstract</title>
  <desc id="desc">A scientific graphical abstract showing document inputs, AGFC atom graph figure closure, stable contracts, and downstream figure repair integrations.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef5f8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eef7"/>
      <stop offset="100%" stop-color="#8ec5dd"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d8"/>
      <stop offset="100%" stop-color="#f3c96c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f4ea"/>
      <stop offset="100%" stop-color="#92c9a7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203349"/>
      <stop offset="100%" stop-color="#102033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#31516b"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#092033" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d7e2ea" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#paper)"/>
  <path d="M0 502 C300 460 510 560 800 512 C1080 466 1308 450 1600 500 L1600 640 L0 640 Z" fill="#e5eef4"/>
  <path d="M86 88 H1514" stroke="#d5e2eb" stroke-width="2"/>

  <text x="86" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#132338">AGFC: Atom-Graph Figure Closure</text>
  <text x="86" y="92" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#51687d">Reusable figure extraction, stable contracts, and parser artifact repair</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="82" y="128" width="290" height="360" rx="24" fill="#ffffff" stroke="#c5d5df" stroke-width="2" filter="url(#softShadow)"/>
    <text x="116" y="176" font-size="24" font-weight="700" fill="#132338">1. Heterogeneous inputs</text>
    <text x="116" y="204" font-size="15" fill="#597084">PDF, PPTX, DOCX and parser artifacts</text>

    <g transform="translate(124 244)">
      <path d="M0 0 H92 L128 36 V156 H0 Z" fill="#f7fbfd" stroke="#203349" stroke-width="3"/>
      <path d="M92 0 V36 H128" fill="none" stroke="#203349" stroke-width="3"/>
      <rect x="22" y="72" width="84" height="50" rx="5" fill="url(#blue)" stroke="#31516b" stroke-width="2"/>
      <path d="M26 116 L50 91 L69 105 L84 84 L104 116 Z" fill="#5ca6c7"/>
      <circle cx="90" cy="83" r="7" fill="#f0b857"/>
      <text x="17" y="193" font-size="16" font-weight="700" fill="#213448">source document</text>
    </g>

    <g transform="translate(254 246)">
      <rect x="0" y="0" width="70" height="96" rx="10" fill="#f9fbfc" stroke="#456176" stroke-width="2"/>
      <rect x="12" y="16" width="46" height="8" rx="4" fill="#8ec5dd"/>
      <rect x="12" y="34" width="46" height="8" rx="4" fill="#f3c96c"/>
      <rect x="12" y="52" width="34" height="8" rx="4" fill="#92c9a7"/>
      <rect x="12" y="70" width="42" height="8" rx="4" fill="#c6d4df"/>
      <text x="-2" y="134" font-size="16" font-weight="700" fill="#213448">MinerU artifact</text>
    </g>
  </g>

  <path d="M390 306 C440 290 466 290 514 306" fill="none" stroke="#31516b" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="514" y="128" width="390" height="360" rx="24" fill="#ffffff" stroke="#c5d5df" stroke-width="2" filter="url(#softShadow)"/>
    <text x="548" y="176" font-size="24" font-weight="700" fill="#132338">2. AGFC core</text>
    <text x="548" y="204" font-size="15" fill="#597084">Atom graph, negative evidence and closure ranking</text>

    <g transform="translate(588 258)">
      <line x1="86" y1="48" x2="190" y2="34" stroke="#88a8ba" stroke-width="3"/>
      <line x1="86" y1="48" x2="154" y2="130" stroke="#88a8ba" stroke-width="3"/>
      <line x1="190" y1="34" x2="260" y2="100" stroke="#88a8ba" stroke-width="3"/>
      <line x1="154" y1="130" x2="260" y2="100" stroke="#88a8ba" stroke-width="3"/>
      <line x1="154" y1="130" x2="80" y2="174" stroke="#88a8ba" stroke-width="3"/>
      <circle cx="86" cy="48" r="28" fill="url(#blue)" stroke="#31516b" stroke-width="3"/>
      <circle cx="190" cy="34" r="22" fill="#f6e3ae" stroke="#8a6a1d" stroke-width="3"/>
      <circle cx="260" cy="100" r="30" fill="#e6f4ec" stroke="#397a55" stroke-width="3"/>
      <circle cx="154" cy="130" r="24" fill="#eef3f7" stroke="#415b70" stroke-width="3"/>
      <circle cx="80" cy="174" r="18" fill="#fde7df" stroke="#b35a40" stroke-width="3"/>
      <text x="50" y="232" font-size="15" fill="#213448">annotation extent</text>
      <text x="198" y="232" font-size="15" fill="#213448">boundary calibration</text>
      <path d="M28 18 H314 V194 H28 Z" fill="none" stroke="#c9513a" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="82" y="-8" font-size="16" font-weight="700" fill="#c9513a">figure closure search</text>
    </g>
  </g>

  <path d="M922 306 C974 286 1008 286 1056 306" fill="none" stroke="#31516b" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="1056" y="128" width="242" height="360" rx="24" fill="#ffffff" stroke="#c5d5df" stroke-width="2" filter="url(#softShadow)"/>
    <text x="1088" y="176" font-size="24" font-weight="700" fill="#132338">3. Public contract</text>
    <text x="1088" y="204" font-size="15" fill="#597084">Stable JSON plus file artifacts</text>

    <rect x="1092" y="246" width="170" height="132" rx="14" fill="#f7fbfd" stroke="#31516b" stroke-width="2"/>
    <text x="1112" y="278" font-size="16" font-weight="700" fill="#203349">extract_result.json</text>
    <text x="1112" y="308" font-size="14" fill="#51687d">page_idx</text>
    <text x="1112" y="332" font-size="14" fill="#51687d">figure_bbox</text>
    <text x="1112" y="356" font-size="14" fill="#51687d">caption_text</text>

    <rect x="1100" y="404" width="46" height="46" rx="8" fill="url(#green)" stroke="#397a55" stroke-width="2"/>
    <rect x="1162" y="404" width="46" height="46" rx="8" fill="url(#amber)" stroke="#8a6a1d" stroke-width="2"/>
    <rect x="1224" y="404" width="46" height="46" rx="8" fill="url(#blue)" stroke="#31516b" stroke-width="2"/>
    <text x="1104" y="468" font-size="13" fill="#51687d">CLI</text>
    <text x="1156" y="468" font-size="13" fill="#51687d">HTTP</text>
    <text x="1214" y="468" font-size="13" fill="#51687d">Python</text>
  </g>

  <path d="M1316 306 C1350 292 1378 292 1418 306" fill="none" stroke="#31516b" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="1418" y="128" width="100" height="360" rx="24" fill="#ffffff" stroke="#c5d5df" stroke-width="2" filter="url(#softShadow)"/>
    <text x="1400" y="176" font-size="24" font-weight="700" fill="#132338">4. Reuse</text>
    <text x="1370" y="204" font-size="15" fill="#597084">Repair and integration</text>

    <g transform="translate(1370 246)">
      <rect x="0" y="0" width="148" height="70" rx="14" fill="#edf7f1" stroke="#397a55" stroke-width="2"/>
      <text x="20" y="43" font-size="18" font-weight="700" fill="#24553b">MinerU repair</text>
      <rect x="0" y="92" width="148" height="70" rx="14" fill="#f8f1db" stroke="#8a6a1d" stroke-width="2"/>
      <text x="18" y="135" font-size="18" font-weight="700" fill="#674f18">DataProxy</text>
      <rect x="0" y="184" width="148" height="70" rx="14" fill="#eef3f7" stroke="#415b70" stroke-width="2"/>
      <text x="15" y="227" font-size="18" font-weight="700" fill="#213448">Other systems</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="118" y="536" width="1354" height="58" rx="29" fill="url(#ink)"/>
    <text x="168" y="573" font-size="18" font-weight="700" fill="#ffffff">Document parsing</text>
    <text x="492" y="573" font-size="18" font-weight="700" fill="#ffffff">Atom graph closure</text>
    <text x="856" y="573" font-size="18" font-weight="700" fill="#ffffff">Stable service contract</text>
    <text x="1220" y="573" font-size="18" font-weight="700" fill="#ffffff">Cross-project repair</text>
    <path d="M392 536 L448 565 L392 594" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M764 536 L820 565 L764 594" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M1128 536 L1184 565 L1128 594" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
