  <path d="M531 302 V340" class="line"/>
  <path d="M731 302 V340" class="line"/>
  <path d="M531 394 C531 414 552 424 589 428" class="greenLine"/>
  <path d="M731 394 C731 414 710 424 673 428" class="greenLine"/>

  <rect x="918" y="190" width="292" height="300" rx="0" class="card"/>
  <rect x="918" y="190" width="292" height="34" rx="0" class="section"/>
  <text x="938" y="212" class="sectionText">Stable Contract</text>
  <rect x="944" y="250" width="240" height="66" rx="0" class="greenCard"/>
  <text x="962" y="275" class="nodeTitle">extract_result.json</text>
  <text x="962" y="294" class="nodeText">figure_bbox, content_bbox</text>
  <text x="962" y="311" class="nodeText">support_bbox, caption_text</text>
  <rect x="944" y="338" width="240" height="66" rx="0" class="card"/>
  <text x="962" y="363" class="nodeTitle">artifact paths</text>
  <text x="962" y="382" class="nodeText">images_dir, summary_json</text>
  <rect x="944" y="426" width="240" height="38" rx="0" class="card"/>
  <text x="962" y="450" class="nodeTitle">versioned JSON Schemas</text>

  <rect x="1268" y="190" width="236" height="300" rx="0" class="card"/>
  <rect x="1268" y="190" width="236" height="34" rx="0" class="section"/>
  <text x="1288" y="212" class="sectionText">Interfaces</text>
  <rect x="1294" y="250" width="184" height="44" rx="0" class="greenCard"/>
  <text x="1326" y="277" class="nodeTitle">CLI</text>
  <rect x="1294" y="312" width="184" height="44" rx="0" class="greenCard"/>
  <text x="1316" y="339" class="nodeTitle">HTTP sidecar</text>
  <rect x="1294" y="374" width="184" height="44" rx="0" class="card"/>
  <text x="1320" y="401" class="nodeTitle">Python API</text>
  <rect x="1294" y="436" width="184" height="34" rx="0" class="card"/>
  <text x="1322" y="458" class="nodeTitle">MCP adapter</text>

  <path d="M340 340 H424" class="line"/>
  <rect x="354" y="319" width="54" height="22" rx="3" class="chip"/>
  <text x="364" y="334" class="chipText">parse</text>
  <path d="M842 340 H918" class="line"/>
  <rect x="852" y="319" width="54" height="22" rx="3" class="chip"/>
  <text x="861" y="334" class="chipText">publish</text>
  <path d="M1210 340 H1268" class="line"/>
  <rect x="1215" y="319" width="48" height="22" rx="3" class="chip"/>
  <text x="1225" y="334" class="chipText">serve</text>

  <rect x="92" y="540" width="418" height="160" rx="0" class="card"/>
  <rect x="92" y="540" width="418" height="34" rx="0" class="section"/>
  <text x="112" y="562" class="sectionText">First-party repair application</text>
  <rect x="120" y="596" width="170" height="58" rx="0" class="greenCard"/>
  <text x="138" y="621" class="nodeTitle">MinerU adapter</text>
  <text x="138" y="640" class="nodeText">replace image slots safely</text>
  <rect x="312" y="596" width="170" height="58" rx="0" class="card"/>
  <text x="330" y="621" class="nodeTitle">repaired bundle</text>
  <text x="330" y="640" class="nodeText">content_list + final_images</text>
  <path d="M290 625 H312" class="line"/>

  <rect x="558" y="540" width="418" height="160" rx="0" class="card"/>
  <rect x="558" y="540" width="418" height="34" rx="0" class="section"/>
  <text x="578" y="562" class="sectionText">Cross-project consumers</text>
  <rect x="586" y="596" width="158" height="58" rx="0" class="card"/>
  <text x="604" y="621" class="nodeTitle">DataProxy-style</text>
  <text x="604" y="640" class="nodeText">thin client mapping</text>
  <rect x="772" y="596" width="158" height="58" rx="0" class="card"/>
  <text x="790" y="621" class="nodeTitle">Other systems</text>
  <text x="790" y="640" class="nodeText">language-neutral calls</text>

  <rect x="1024" y="540" width="480" height="160" rx="0" class="card"/>
  <rect x="1024" y="540" width="480" height="34" rx="0" class="section"/>
  <text x="1044" y="562" class="sectionText">Benchmark and release loop</text>
  <rect x="1052" y="596" width="136" height="58" rx="0" class="card"/>
  <text x="1070" y="621" class="nodeTitle">JournalMix-v1</text>
  <text x="1070" y="640" class="nodeText">quality + runtime</text>
  <rect x="1212" y="596" width="120" height="58" rx="0" class="greenCard"/>
  <text x="1230" y="621" class="nodeTitle">CI</text>
  <text x="1230" y="640" class="nodeText">482 tests</text>
  <rect x="1356" y="596" width="120" height="58" rx="0" class="greenCard"/>
  <text x="1374" y="621" class="nodeTitle">v0.1.0 RC</text>
  <text x="1374" y="640" class="nodeText">release checklist</text>
  <path d="M1188 625 H1212" class="line"/>
  <path d="M1332 625 H1356" class="line"/>

  <path d="M1386 490 V518 H301 V540" class="greenLine"/>
  <rect x="756" y="507" width="76" height="22" rx="3" class="chip"/>
  <text x="768" y="522" class="chipText">repair call</text>
  <path d="M1386 490 V520 H767 V540" class="greenLine"/>
  <rect x="960" y="509" width="84" height="22" rx="3" class="chip"/>
  <text x="972" y="524" class="chipText">reuse API</text>
  <path d="M632 490 V518 H1264 V540" class="line"/>
  <rect x="900" y="507" width="92" height="22" rx="3" class="chip"/>
  <text x="912" y="522" class="chipText">measure</text>

  <rect x="64" y="792" width="1472" height="54" rx="0" fill="#282828"/>
  <text x="92" y="826" class="sectionText">Design principle: AGFC keeps algorithms, contracts, service runtime, adapters, and benchmarks inside one reusable product repository.</text>
</svg>
