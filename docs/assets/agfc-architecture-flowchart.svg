<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AGFC 平台化架构：稳定抽图能力与跨项目修复</title>
  <desc id="desc">A polished minimal-flowchart style architecture diagram in Chinese, showing AGFC inputs, core figure extraction, stable contract outputs, plugin reuse, and release governance.</desc>
  <defs>
    <marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8088B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#309878" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #3050A0; }
      .subtitle { font: 400 14px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #505050; }
      .barText { font: 700 16px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #FFFFFF; }
      .busText { font: 700 16px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .nodeTitle { font: 700 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #22252A; }
      .nodeTitleGreen { font: 700 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #309878; }
      .nodeTitleRed { font: 700 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #A82040; }
      .body { font: 400 12.5px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #505050; }
      .bodySmall { font: 400 11.5px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #505050; }
      .railText { font: 700 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .chipText { font: 700 11px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Inter, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .plate { fill: #EEF4F7; stroke: #D0D0D0; stroke-width: 1; }
      .panel { fill: #FFFFFF; stroke: #D0D0D0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #B8B8B8; stroke-width: 1; }
      .cardGreen { fill: #E0F0E8; stroke: #309878; stroke-width: 1.2; }
      .cardRed { fill: #F8E8E8; stroke: #A82040; stroke-width: 1.2; }
      .barBlue { fill: #3050A0; }
      .barGreen { fill: #309878; }
      .barBlack { fill: #282828; }
      .line { fill: none; stroke: #8088B0; stroke-width: 1.7; marker-end: url(#arrow-line); }
      .lineGreen { fill: none; stroke: #309878; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .chip { fill: #8080A8; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .whiteIcon { color: #FFFFFF; }
      .greenIcon { color: #309878; }
      .mutedIcon { color: #505050; }
    </style>
    <symbol id="icon-doc" viewBox="0 0 24 24">
      <path class="icon" d="M6 3h8l4 4v14H6z"/>
      <path class="icon" d="M14 3v5h5M9 13h6M9 17h6"/>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect class="icon" x="4" y="4" width="6" height="6"/>
      <rect class="icon" x="14" y="4" width="6" height="6"/>
      <rect class="icon" x="4" y="14" width="6" height="6"/>
      <rect class="icon" x="14" y="14" width="6" height="6"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path class="icon" d="M12 3l7 3v5c0 5-3.2 8.5-7 10-3.8-1.5-7-5-7-10V6z"/>
      <path class="icon" d="M9 12l2 2 4-5"/>
    </symbol>
    <symbol id="icon-link" viewBox="0 0 24 24">
      <path class="icon" d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1 1"/>
      <path class="icon" d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20l1-1"/>
    </symbol>
    <symbol id="icon-wrench" viewBox="0 0 24 24">
      <path class="icon" d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5z"/>
      <path class="icon" d="M15 6l3 3"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="64" y="52" class="title">AGFC 平台化架构：稳定抽图能力与跨项目修复</text>
  <text x="64" y="78" class="subtitle">核心算法、稳定 contract、CLI / HTTP sidecar 与 MinerU 修复能力在一个可复用产品仓内交付。</text>

  <rect x="64" y="104" width="1472" height="730" class="plate"/>

  <rect x="92" y="138" width="128" height="430" class="barBlue"/>
  <use href="#icon-grid" x="144" y="300" width="24" height="24" class="whiteIcon"/>
  <text x="156" y="355" class="railText">
    <tspan x="156" dy="0">跨项目</tspan>
    <tspan x="156" dy="24">消费者</tspan>
  </text>

  <rect x="252" y="132" width="264" height="436" class="panel"/>
  <rect x="252" y="132" width="264" height="44" class="barBlue"/>
  <use href="#icon-doc" x="274" y="143" width="18" height="18" class="whiteIcon"/>
  <text x="304" y="160" class="barText">输入与触发</text>

  <rect x="282" y="202" width="204" height="80" class="card"/>
  <text x="302" y="228" class="nodeTitle">源文档</text>
  <text x="302" y="250" class="body">PDF / PPTX / DOCX</text>
  <text x="302" y="268" class="body">页面图像与版面对象</text>

  <rect x="282" y="322" width="204" height="92" class="card"/>
  <text x="302" y="348" class="nodeTitle">MinerU 解析工件</text>
  <text x="302" y="370" class="body">content_list.json</text>
  <text x="302" y="388" class="body">full.md / extracted / images</text>

  <rect x="282" y="456" width="204" height="74" class="cardGreen"/>
  <text x="302" y="482" class="nodeTitleGreen">候选证据</text>
  <text x="302" y="504" class="body">文本 / 栅格 / 矢量</text>
  <text x="302" y="522" class="body">版面原语</text>

  <rect x="596" y="132" width="500" height="436" class="panel"/>
  <rect x="596" y="132" width="500" height="44" class="barBlue"/>
  <use href="#icon-link" x="618" y="143" width="18" height="18" class="whiteIcon"/>
  <text x="648" y="160" class="barText">AGFC 核心与运行入口</text>

  <rect x="632" y="204" width="428" height="44" class="barGreen"/>
  <text x="846" y="232" class="busText">CLI / HTTP Sidecar / Python API / MCP 适配</text>

  <rect x="632" y="304" width="180" height="78" class="card"/>
  <text x="652" y="330" class="nodeTitle">原子图构建</text>
  <text x="652" y="352" class="body">文本 / 位图 / 矢量</text>
  <text x="652" y="370" class="body">版面原语归一化</text>

  <rect x="884" y="304" width="180" height="78" class="cardRed"/>
  <text x="904" y="330" class="nodeTitleRed">负证据过滤</text>
  <text x="904" y="352" class="body">正文 / 页脚 / 表格</text>
  <text x="904" y="370" class="body">误抽区域抑制</text>

  <rect x="632" y="434" width="180" height="78" class="cardGreen"/>
  <text x="652" y="460" class="nodeTitleGreen">闭包排序</text>
  <text x="652" y="482" class="body">候选边界评分</text>
  <text x="652" y="500" class="body">panel 逻辑分组</text>

  <rect x="884" y="434" width="180" height="78" class="cardGreen"/>
  <text x="904" y="460" class="nodeTitleGreen">图像导出</text>
  <text x="904" y="482" class="body">figure crop / PNG 文件</text>
  <text x="904" y="500" class="body">review_html / summary_json</text>

  <rect x="1176" y="132" width="300" height="436" class="panel"/>
  <rect x="1176" y="132" width="300" height="44" class="barGreen"/>
  <use href="#icon-shield" x="1198" y="143" width="18" height="18" class="whiteIcon"/>
  <text x="1228" y="160" class="barText">稳定 Contract</text>

  <rect x="1208" y="204" width="236" height="146" class="cardGreen"/>
  <text x="1228" y="230" class="nodeTitleGreen">统一 JSON 结果</text>
  <text x="1228" y="254" class="bodySmall">page_idx / figure_id</text>
  <text x="1228" y="273" class="bodySmall">figure_bbox / content_bbox</text>
  <text x="1228" y="292" class="bodySmall">support_bbox / caption_text</text>
  <text x="1228" y="311" class="bodySmall">panel_ids / logical_group_id</text>
  <text x="1228" y="330" class="bodySmall">boundary_strategy</text>

  <rect x="1208" y="386" width="236" height="84" class="card"/>
  <text x="1228" y="412" class="nodeTitle">文件产物路径</text>
  <text x="1228" y="436" class="body">images_dir / review_html</text>
  <text x="1228" y="454" class="body">summary_json / run_dir</text>

  <rect x="1208" y="506" width="236" height="40" class="cardGreen"/>
  <use href="#icon-shield" x="1228" y="516" width="18" height="18" class="greenIcon"/>
  <text x="1260" y="532" class="nodeTitleGreen">JSON Schema 版本化</text>

  <path d="M220 244 L282 242" class="line"/>
  <path d="M220 370 L282 368" class="line"/>

  <path d="M486 242 H552 V226 H632" class="line"/>
  <rect x="528" y="211" width="78" height="24" rx="3" class="chip"/>
  <text x="567" y="227" class="chipText">抽图请求</text>

  <path d="M486 368 H552 V238 H632" class="line"/>
  <rect x="528" y="286" width="78" height="24" rx="3" class="chip"/>
  <text x="567" y="302" class="chipText">修复请求</text>

  <path d="M486 493 H552 V343 H632" class="line"/>
  <rect x="528" y="414" width="78" height="24" rx="3" class="chip"/>
  <text x="567" y="430" class="chipText">证据归一</text>

  <path d="M846 248 V304" class="line"/>
  <path d="M812 343 H884" class="line"/>
  <path d="M722 382 V434" class="line"/>
  <path d="M974 382 V434" class="line"/>
  <path d="M812 473 H884" class="lineGreen"/>

  <path d="M1064 473 H1136 V277 H1208" class="line"/>
  <rect x="1098" y="362" width="78" height="24" rx="3" class="chip"/>
  <text x="1137" y="378" class="chipText">稳定输出</text>
  <path d="M1326 350 V386" class="line"/>
  <path d="M1326 470 V506" class="lineGreen"/>

  <rect x="252" y="614" width="1224" height="146" class="panel"/>
  <rect x="252" y="614" width="1224" height="44" class="barBlue"/>
  <use href="#icon-wrench" x="274" y="625" width="18" height="18" class="whiteIcon"/>
  <text x="304" y="642" class="barText">插件化应用与跨项目复用</text>

  <rect x="282" y="688" width="260" height="52" class="cardGreen"/>
  <use href="#icon-wrench" x="302" y="704" width="18" height="18" class="greenIcon"/>
  <text x="338" y="710" class="nodeTitleGreen">MinerU 修复插件</text>
  <text x="338" y="730" class="bodySmall">替换图片，并回写副本工件</text>

  <rect x="582" y="688" width="260" height="52" class="card"/>
  <use href="#icon-link" x="602" y="704" width="18" height="18" class="mutedIcon"/>
  <text x="638" y="710" class="nodeTitle">DataProxy 薄适配</text>
  <text x="638" y="730" class="bodySmall">只做 contract 映射</text>

  <rect x="882" y="688" width="260" height="52" class="card"/>
  <use href="#icon-grid" x="902" y="704" width="18" height="18" class="mutedIcon"/>
  <text x="938" y="710" class="nodeTitle">其他解析 / 检索系统</text>
  <text x="938" y="730" class="bodySmall">语言无关接入</text>

  <rect x="1182" y="688" width="260" height="52" class="card"/>
  <use href="#icon-link" x="1202" y="704" width="18" height="18" class="mutedIcon"/>
  <text x="1238" y="710" class="nodeTitle">Agent / MCP 工具</text>
  <text x="1238" y="730" class="bodySmall">最外层薄适配</text>

  <path d="M1326 568 V614" class="line"/>
  <rect x="1342" y="580" width="116" height="24" rx="3" class="chip"/>
  <text x="1400" y="596" class="chipText">读取 contract</text>

  <path d="M542 714 H582" class="lineGreen"/>
  <path d="M842 714 H882" class="line"/>
  <path d="M1142 714 H1182" class="line"/>

  <path d="M1012 740 V788" class="line"/>
  <rect x="252" y="788" width="1224" height="48" class="barGreen"/>
  <text x="864" y="818" class="busText">发布治理：JournalMix-v1 Benchmark / CI 回归 / Release Checklist</text>

  <rect x="252" y="846" width="1224" height="34" class="barBlack"/>
  <text x="864" y="868" class="busText">设计原则：AGFC 维护核心算法与稳定 contract，下游项目只依赖 CLI / HTTP / JSON Schema</text>
