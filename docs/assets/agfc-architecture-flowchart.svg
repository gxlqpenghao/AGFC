<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AGFC public product architecture</title>
  <desc id="desc">A minimalist whitepaper architecture diagram for AGFC, showing inputs, core figure extraction, stable contracts, interfaces, consumers, and benchmark governance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#8088B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #22252A; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #505050; }
      .section { fill: #3050A0; }
      .sectionText { font: 700 17px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .plate { fill: #EEF4F7; stroke: #D0D0D0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #B8B8B8; stroke-width: 1; }
      .greenCard { fill: #E0F0E8; stroke: #309878; stroke-width: 1.2; }
      .redCard { fill: #F8E8E8; stroke: #A82040; stroke-width: 1.2; }
      .nodeTitle { font: 700 15px Arial, Helvetica, sans-serif; fill: #22252A; }
      .nodeText { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #505050; }
      .small { font: 600 11px Arial, Helvetica, sans-serif; fill: #505050; }
      .chip { fill: #8080A8; }
      .chipText { font: 700 11px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .line { fill: none; stroke: #8088B0; stroke-width: 1.8; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #309878; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #707070; stroke-width: 1.2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="64" y="58" class="title">AGFC Public Product Architecture</text>
  <text x="64" y="86" class="subtitle">Independent figure extraction capability with stable contracts, sidecar runtime, and first-party MinerU repair.</text>

  <rect x="64" y="120" width="1472" height="640" rx="0" class="plate"/>
  <rect x="64" y="120" width="1472" height="38" rx="0" class="section"/>
  <text x="88" y="145" class="sectionText">Runtime and integration boundary</text>

  <rect x="92" y="190" width="248" height="300" rx="0" class="card"/>
  <rect x="92" y="190" width="248" height="34" rx="0" class="section"/>
  <text x="112" y="212" class="sectionText">Inputs</text>
  <rect x="116" y="250" width="200" height="52" rx="0" class="card"/>
  <text x="132" y="274" class="nodeTitle">Source documents</text>
  <text x="132" y="292" class="nodeText">PDF / PPTX / DOCX</text>
  <rect x="116" y="320" width="200" height="52" rx="0" class="card"/>
  <text x="132" y="344" class="nodeTitle">Parser artifacts</text>
  <text x="132" y="362" class="nodeText">content_list / full.md / images</text>
  <rect x="116" y="390" width="200" height="52" rx="0" class="greenCard"/>
  <text x="132" y="414" class="nodeTitle">Candidate evidence</text>
  <text x="132" y="432" class="nodeText">text, raster, vector, layout atoms</text>

  <rect x="424" y="190" width="418" height="300" rx="0" class="card"/>
  <rect x="424" y="190" width="418" height="34" rx="0" class="section"/>
  <text x="444" y="212" class="sectionText">AGFC Core</text>
  <rect x="452" y="248" width="158" height="54" rx="0" class="card"/>
  <text x="468" y="272" class="nodeTitle">Atom graph</text>
  <text x="468" y="290" class="nodeText">normalize page primitives</text>
  <rect x="652" y="248" width="158" height="54" rx="0" class="card"/>
  <text x="668" y="272" class="nodeTitle">Panel grouping</text>
  <text x="668" y="290" class="nodeText">visual communities</text>
  <rect x="452" y="340" width="158" height="54" rx="0" class="redCard"/>
  <text x="468" y="364" class="nodeTitle">Negative evidence</text>
  <text x="468" y="382" class="nodeText">reject body, table, footer</text>
  <rect x="652" y="340" width="158" height="54" rx="0" class="greenCard"/>
  <text x="668" y="364" class="nodeTitle">Closure ranking</text>
  <text x="668" y="382" class="nodeText">select figure boundary</text>
  <rect x="552" y="428" width="158" height="38" rx="0" class="greenCard"/>
  <text x="584" y="452" class="nodeTitle">Figure export</text>
